version: '3.8'

services:
  # Web 应用
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./data/git:/var/git/repositories
    depends_on:
      - db
      - redis
    environment:
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-codevault}
      - DB_USER=${DB_USER:-codevault}
      - DB_PASS=${DB_PASS:?DB_PASS is required}
      - REDIS_HOST=redis
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
    networks:
      - codevault-network
    restart: unless-stopped

  # MySQL 数据库
  db:
    image: mysql:8.0
    # 生产环境不暴露端口
    # ports:
    #   - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      - MYSQL_DATABASE=${DB_NAME:-codevault}
      - MYSQL_USER=${DB_USER:-codevault}
      - MYSQL_PASSWORD=${DB_PASS:?DB_PASS is required}
    volumes:
      - db-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    networks:
      - codevault-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    # 生产环境不暴露端口
    # ports:
    #   - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis-data:/data
    networks:
      - codevault-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 前端开发服务器（仅开发环境）
  frontend:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    profiles:
      - dev
    networks:
      - codevault-network

volumes:
  db-data:
  redis-data:

networks:
  codevault-network:
    driver: bridge
